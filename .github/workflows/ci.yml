name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # ubuntu-latest Ubuntu 26'ya geçiyor; Playwright'ın sistem paketleri desteklenen sürümde kurulur.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Yalnızca CI içindir; gerçek değerler Vercel'de durur.
      BETTER_AUTH_SECRET: ci-only-not-a-real-secret-0000000000000000
      BETTER_AUTH_URL: http://localhost:3100
      DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # docs:check git sırasını denetler
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Belgeler güncel (D-017)
        run: pnpm docs:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm db:migrate
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Playwright tarayıcısı ve sistem paketleri
        timeout-minutes: 6
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks (bütün geçmiş)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --verbose
